# Ripubblica il sito dai dati dell'ultimo giro (branch data), senza riscansionare:
# parte quando cambia la grafica o un catalogo, oppure a mano.
name: Pubblica sito

on:
  push:
    branches: [main]
    paths:
      - "template_v2.html"
      - "v2.css"
      - "v2.js"
      - "img/**"
      - "build*.py"
      - "dests.py"
      - "origins.py"
      - "itineraries.py"
      - "popular_trips.py"
      - "pipeline.py"
      - "price_history.py"
      - "bot/config.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# stesso gruppo della scansione: se un giro e' in corso si aspetta che finisca, cosi' non si ripubblicano dati vecchi sopra i nuovi
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages1.outputs.page_url || steps.pages2.outputs.page_url || steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dati dell'ultimo giro
        run: bash .github/fetch_data.sh .

      - name: Build del sito
        run: python pipeline.py build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages a volte non trova subito l'artifact ("No artifacts named github-pages"): si riprova due volte con una pausa
      - name: Pubblica su GitHub Pages
        id: pages1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Pausa prima del secondo tentativo
        if: steps.pages1.outcome == 'failure'
        run: sleep 60
      - name: Pubblica su GitHub Pages (2)
        id: pages2
        if: steps.pages1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Pausa prima del terzo tentativo
        if: steps.pages1.outcome == 'failure' && steps.pages2.outcome == 'failure'
        run: sleep 120
      - name: Pubblica su GitHub Pages (3)
        id: pages
        if: steps.pages1.outcome == 'failure' && steps.pages2.outcome == 'failure'
        uses: actions/deploy-pages@v5
